<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="shared.css"></head>
<body><div class="device"><div class="screen">
  <div class="statusbar"><span>9:41</span><span class="dots">●●● ▰▰▰ 🔋</span></div>
  <div class="body" style="background:radial-gradient(120% 70% at 50% 0%,#16223a,#070a0e)">
    <div style="text-align:center;padding:18px 0 6px">
      <div class="cond" style="color:var(--gold);font-size:13px;letter-spacing:4px">CARD FLIP DRAFT</div>
      <div class="display" style="font-size:30px">TAP TO REVEAL</div>
      <div class="cond muted" style="font-size:12px;letter-spacing:2px;margin-top:2px">4 OF 10 PICKS REVEALED</div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px 22px">
      <!-- revealed -->
      <div style="aspect-ratio:3/4.1;border-radius:16px;background:var(--panel);border:1.5px solid var(--panel-line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;position:relative">
        <div class="display" style="position:absolute;top:8px;left:12px;font-size:16px;color:var(--gold)">1ST</div>
        <div class="jersey" style="background:linear-gradient(160deg,#3A86FF,#1f5fd1);width:60px;height:60px;font-size:28px">07</div>
        <div class="display" style="font-size:22px">DANA</div>
      </div>
      <div style="aspect-ratio:3/4.1;border-radius:16px;background:var(--panel);border:1.5px solid var(--panel-line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;position:relative">
        <div class="display" style="position:absolute;top:8px;left:12px;font-size:16px;color:var(--gold)">2ND</div>
        <div class="jersey" style="background:linear-gradient(160deg,#FFB703,#cf8f00);color:#241500;width:60px;height:60px;font-size:28px">23</div>
        <div class="display" style="font-size:22px">MARCUS</div>
      </div>
      <div style="aspect-ratio:3/4.1;border-radius:16px;background:var(--panel);border:1.5px solid var(--panel-line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;position:relative">
        <div class="display" style="position:absolute;top:8px;left:12px;font-size:16px;color:var(--gold)">3RD</div>
        <div class="jersey" style="background:linear-gradient(160deg,#E63946,#a51e2a);width:60px;height:60px;font-size:28px">12</div>
        <div class="display" style="font-size:22px">COLEMAN</div>
      </div>
      <!-- next card, lifting -->
      <div style="aspect-ratio:3/4.1;border-radius:16px;background:repeating-linear-gradient(45deg,#1c2736 0 12px,#16202c 12px 24px);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;transform:translateY(-10px) rotate(-3deg);box-shadow:0 18px 30px rgba(0,0,0,.5)">
        <div style="text-align:center"><div style="font-size:42px">🏈</div><div class="display" style="font-size:18px;color:var(--gold);margin-top:6px">PICK 4</div><div class="cond muted" style="font-size:11px;letter-spacing:2px">TAP!</div></div>
      </div>
      <!-- face down -->
      <div style="aspect-ratio:3/4.1;border-radius:16px;background:repeating-linear-gradient(45deg,#1c2736 0 12px,#16202c 12px 24px);border:1.5px solid var(--panel-line);display:flex;align-items:center;justify-content:center;opacity:.8"><div style="font-size:36px;opacity:.5">🏈</div></div>
      <div style="aspect-ratio:3/4.1;border-radius:16px;background:repeating-linear-gradient(45deg,#1c2736 0 12px,#16202c 12px 24px);border:1.5px solid var(--panel-line);display:flex;align-items:center;justify-content:center;opacity:.8"><div style="font-size:36px;opacity:.5">🏈</div></div>
    </div>

    <div style="position:absolute;bottom:26px;left:22px;right:22px">
      <button class="btn btn-ghost cond" style="height:50px;font-size:16px">⤓ REVEAL ALL</button>
    </div>
  </div>
  <div class="home-ind"></div>
</div></div></body></html>
